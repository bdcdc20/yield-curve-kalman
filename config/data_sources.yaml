# Data sources for the yield-curve-kalman project.
# Everything here is free and public. Fixing a broken series ID should only
# ever need an edit to this file, not to the code.

# Maturity grid in months. These are the 17 maturities used by
# Diebold-Rudebusch-Aruoba (2006) / Diebold-Li (2006).
maturities_months: [3, 6, 9, 12, 15, 18, 21, 24, 30, 36, 48, 60, 72, 84, 96, 108, 120]

# Forecast horizons (months). The pipeline also stores curves at every extra
# maturity that the forward-rate benchmark needs for these horizons: h itself
# and tau + h for each grid maturity tau (README section 7.4).
forecast_horizons_months: [1, 6, 12]

curves:
  USD:
    # Gurkaynak-Sack-Wright (2007) Svensson fit, daily, 1961-present.
    # We evaluate the published parameters on our grid rather than using the
    # SVENYxx columns, which only cover whole years.
    source: fed_gsw
    url: https://www.federalreserve.gov/data/yield-curve-tables/feds200628.csv
    # GSW excludes bills, so fits below ~1y are extrapolated. Keep T-bills
    # alongside as a check on the short end.
    short_end_check: [DTB3, DTB6]
  EUR:
    # ECB Svensson fit, AAA-rated euro area central government bonds, daily, Sep 2004-present.
    source: ecb_yc
    flow: YC
    key_prefix: B.U2.EUR.4F.G_N_A.SV_C_YM
    params: [BETA0, BETA1, BETA2, BETA3, TAU1, TAU2]
    # Published spot rates, used only to verify our reconstruction from the parameters.
    check_rates: [SR_1Y, SR_5Y, SR_10Y]
  GBP:
    # BoE nominal government liability curve (Anderson-Sleath spline), daily, 1979-present.
    source: boe_glc
    url: https://www.bankofengland.co.uk/-/media/boe/files/statistics/yield-curves/glcnominalddata.zip
    sheets:
      # Pre-2005 workbooks prefix the sheet names with "nominal".
      main: ["4. spot curve", "4. nominal spot curve"]                # maturities in years (0.5y steps)
      short_end: ["3. spot, short end", "3. nominal spot, short end"] # maturities in months

# Macro block: real activity, inflation, policy rate (DRA 2006).
# transform: level | yoy  (yoy = 12-month % change of an index)
# vintages: true -> pull the full ALFRED real-time history (needs FRED_API_KEY)
macro:
  USD:
    real_activity: {source: fred, id: TCU, transform: level, vintages: true}       # capacity utilisation, as in DRA
    inflation:     {source: fred, id: PCEPI, transform: yoy, vintages: true}       # PCE price index, as in DRA
    policy_rate:   {source: fred, id: FEDFUNDS, transform: level, vintages: false} # never revised
  EUR:
    real_activity: {source: ecb, flow: STBS, key: M.I10.Y.PROD.NS0020.4D0.N.IX, transform: yoy}  # EA21 industrial production ex construction, SA+WDA (STS was frozen in 2025)
    inflation:     {source: ecb, flow: HICP, key: M.U2.N.000000.4D0.ANR, transform: level}   # HICP annual rate, changing composition (ICP was frozen at Dec 2025)
    policy_rate:   {source: ecb, flow: FM, key: D.U2.EUR.4F.KR.DFR.LEV, transform: level}  # deposit facility rate
  GBP:
    real_activity: {source: ons, uri: /economy/economicoutputandproductivity/output/timeseries/k222/diop, transform: yoy}  # index of production
    inflation:     {source: ons, uri: /economy/inflationandpriceindices/timeseries/d7g7/mm23, transform: level}            # CPI annual rate
    policy_rate:   {source: boe_iadb, code: IUDBEDR, transform: level}                                                     # Bank Rate

# Survey expectations of long-run rates and inflation, used as shifting
# endpoints for the level factor (README section 7.6, roadmap step 7b).
# Quarterly; a survey counts as known from the end of month
# `survey_known_month` of its quarter (the Philadelphia Fed SPF is published
# mid-February/May/August/November, the ECB SPF a few weeks after its
# January/April/July/October round), so a forecast never uses a survey
# before it was out. There is no long free UK survey.
survey_known_month: 2
surveys:
  USD:
    # Median expected average 10-year Treasury yield over the next 10 years; first-quarter surveys, 1992-.
    bond10: {source: spf, url: "https://www.philadelphiafed.org/-/media/FRBP/Assets/Surveys-And-Data/survey-of-professional-forecasters/data-files/files/Median_BOND10_Level.xlsx", column: BOND10}
    # Median expected average CPI inflation over the next 10 years; every quarter, 1991Q4-.
    cpi10:  {source: spf, url: "https://www.philadelphiafed.org/-/media/FRBP/Assets/Surveys-And-Data/survey-of-professional-forecasters/data-files/files/Median_CPI10_Level.xlsx", column: CPI10}
  EUR:
    # ECB SPF longer-term (about five years ahead) HICP inflation, average of point forecasts, 1999Q1-.
    hicp_lt: {source: ecb, flow: SPF, key: Q.U2.HICP.POINT.LT.Q.AVG}

# Publication lag (months) applied to macro series that have no vintage
# history, so that a month-t forecast only uses data released by month t.
release_lag_months:
  real_activity: 2
  inflation: 1
  policy_rate: 0
