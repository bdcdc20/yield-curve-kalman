[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yck"
version = "0.1.0"
description = "Dynamic Nelson-Siegel yield curve model with macro factors, estimated by Kalman filter (USD/EUR/GBP, public data)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Bruno del Castillo"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "requests>=2.31",
  "openpyxl>=3.1",
  "pyarrow>=14",
  "pyyaml>=6",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "statsmodels>=0.14"]
notebook = ["matplotlib>=3.8", "jupyter>=1.0", "nbconvert>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
